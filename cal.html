<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="calculator.css">
</head>

<body>

    <div class="container">
        <h1>🌡️ Temperature Converter</h1>
        <p class="subtitle">Convert temperatures easily between different units</p>

        <!-- Temperature Input -->
        <label for="temperature">Enter Temperature</label>
        <input
            type="text"
            id="temperature"
            placeholder="Enter a number"
        >

        <!-- Input Unit -->
        <label for="unit">Select Input Unit</label>
        <select id="unit">
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="kelvin">Kelvin (K)</option>
        </select>

        <!-- Convert Button -->
        <button id="convertBtn">Convert</button>

        <!-- Error Message -->
        <p id="errorMessage"></p>

        <!-- Results -->
        <div class="result-box">
            <h2>Converted Temperatures</h2>

            <p id="celsiusResult">Celsius: -- °C</p>
            <p id="fahrenheitResult">Fahrenheit: -- °F</p>
            <p id="kelvinResult">Kelvin: -- K</p>
        </div>
    </div>

    <script src="cal.js"></script>
</body>
</html>
